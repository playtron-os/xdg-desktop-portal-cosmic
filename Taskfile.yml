version: "3"

vars:
  NAME:
    sh: grep '^name' Cargo.toml | head -n 1 | cut -d'"' -f2
  VERSION:
    sh: grep '^version' Cargo.toml | head -n 1 | cut -d'"' -f2
  HOST_OS:
    sh: uname
  HOST_ARCH:
    sh: uname -m
  TARGET_ARCH:
    sh: "rustc -vV | sed -n 's/host: //p'"
  ARCH:
    sh: echo "{{.TARGET_ARCH}}" | cut -d'-' -f1
  IMAGE_NAME: "{{.NAME}}-builder"
  IMAGE_TAG:
    sh: sha256sum Dockerfile | cut -d' ' -f1
  # D-Bus name of the portal backend; both service files are named after it.
  APPID: org.freedesktop.impl.portal.desktop.cosmic
  # The portal is a D-Bus activated backend, so it installs to libexec rather
  # than bin. Both service files bake this path in via the @libexecdir@ token.
  LIBEXECDIR: /usr/libexec
  # `wgpu` is not a default feature; ship it enabled so the portal renders on
  # the GPU rather than falling back to the tiny-skia software renderer.
  FEATURES: wgpu

tasks:
  default:
    aliases:
      - help
    cmds:
      - go-task --list

  build:debug:
    desc: Build debug build
    cmds:
      - cargo build {{.ARG | default ""}} --features {{.FEATURES}} --target {{.TARGET_ARCH}} --bin {{.NAME}}

  build:release:
    desc: Build release build
    aliases:
      - build
    cmds:
      - cargo build --release --features {{.FEATURES}} --target {{.TARGET_ARCH}} --bin {{.NAME}}

  build:all:
    desc: Build release and debug builds
    deps:
      - build:debug
      - build:release

  run:
    desc: Run the portal backend in the foreground, replacing the installed one
    deps:
      - build:debug
    vars:
      LOG_LEVEL: '{{.LOG_LEVEL | default "info"}}'
    env:
      RUST_LOG: |-
        {{- if eq .LOG_LEVEL "debug" }}
        error,xdg_desktop_portal_cosmic=debug
        {{- else }}
        error,xdg_desktop_portal_cosmic=info
        {{- end }}
    cmds:
      # Only one process can own the bus name, and this one exits if it loses it.
      - pkill -f '{{.LIBEXECDIR}}/{{.NAME}}' || true
      - ./target/{{.TARGET_ARCH}}/debug/{{.NAME}}

  dist:prepare:
    desc: Prepare the project for packaging
    deps:
      - build:release
    vars:
      STAGE: ".cache/{{.NAME}}"
    cmds:
      - rm -rf {{.STAGE}}
      - install -Dm0755 "target/{{.TARGET_ARCH}}/release/{{.NAME}}" "{{.STAGE}}{{.LIBEXECDIR}}/{{.NAME}}"
      # Both service files are templates - substitute the install path.
      - sed 's|@libexecdir@|{{.LIBEXECDIR}}|' "data/dbus-1/{{.APPID}}.service.in"
          | install -Dm0644 /dev/stdin "{{.STAGE}}/usr/share/dbus-1/services/{{.APPID}}.service"
      - sed 's|@libexecdir@|{{.LIBEXECDIR}}|' "data/{{.APPID}}.service.in"
          | install -Dm0644 /dev/stdin "{{.STAGE}}/usr/lib/systemd/user/{{.APPID}}.service"
      # Registers this backend with xdg-desktop-portal; without it nothing routes here.
      - install -Dm0644 "data/cosmic.portal" "{{.STAGE}}/usr/share/xdg-desktop-portal/portals/cosmic.portal"
      - install -Dm0644 "data/cosmic-portals.conf" "{{.STAGE}}/usr/share/xdg-desktop-portal/cosmic-portals.conf"
      - install -Dm0644 "LICENSE" "{{.STAGE}}/usr/share/licenses/{{.NAME}}/LICENSE"
      - mkdir -p dist

  dist:archive:
    desc: Build a tar archive of the project
    deps:
      - dist:prepare
    cmds:
      - tar cvfz dist/{{.NAME}}-{{.ARCH}}.tar.gz -C .cache {{.NAME}}

  dist:rpm:
    desc: Build an RPM package
    aliases:
      - rpm
    deps:
      - dist:archive
    preconditions:
      - sh: which rpmbuild
        msg: "Prerequisite utility 'rpmbuild' is not installed"
    cmds:
      - mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
      - cp ./pkg/rpm/{{.NAME}}.spec ~/rpmbuild/SPECS
      - cp dist/{{.NAME}}-{{.ARCH}}.tar.gz ~/rpmbuild/SOURCES
      - rpmbuild -bb --target {{.ARCH}} ~/rpmbuild/SPECS/{{.NAME}}.spec
      - cp ~/rpmbuild/RPMS/{{.ARCH}}/{{.NAME}}-{{.VERSION}}-*.{{.ARCH}}.rpm dist

  dist:all:
    desc: Build all supported distributable packages
    aliases:
      - dist
    cmds:
      - task: dist:archive
      - task: dist:rpm

  release:
    desc: Publish a new release
    preconditions:
      - sh: which npx
        msg: "Prerequisite utility 'npx' is not installed"
    cmds:
      - npx semantic-release

  repo:update:
    desc: "Upload the release to the package repository"
    vars:
      BUCKET: playtron-dev2-global-os-public
      BUCKET_PATH: repos/playtron-app/{{.ARCH}}
      FILE: "dist/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm"
      REPO_NAME: playtron
    preconditions:
      - sh: ls {{.FILE}}
        msg: "File to upload does not exist: {{.FILE}}"
      - sh: env | grep -q '^PACKAGES_UPLOAD_TOKEN='
        msg: "PACKAGES_UPLOAD_TOKEN environment variable is not set"
    cmds:
      # TODO: Remove S3 uploads after repository switch
      - echo "Uploading {{.FILE}} to s3://{{.BUCKET}}/{{.BUCKET_PATH}}/$(basename {{.FILE}})"
      - aws s3 cp {{.FILE}} s3://{{.BUCKET}}/{{.BUCKET_PATH}}/$(basename "{{.FILE}}")
      - echo "Publishing {{.FILE}} to 'https://packages.playtron.one/rpm/{{.REPO_NAME}}/packages/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm'"
      - "curl -H 'Authorization: Bearer {{.PACKAGES_UPLOAD_TOKEN}}' -T {{.FILE}} 'https://packages.playtron.one/rpm/{{.REPO_NAME}}/packages/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm'"

  fmt:
    desc: Format the source
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run clippy
    aliases:
      - clippy
    cmds:
      - cargo clippy --all-features --all-targets -- -D warnings

  test:all:
    desc: Run all tests
    aliases:
      - test
    cmds:
      - cargo test --all-features -- --show-output

  test:one:
    desc: Run a single test - E.g. go-task test:one TEST=<test>
    requires:
      vars:
        - TEST
    cmds:
      - RUST_BACKTRACE=1 cargo test --all-features {{.TEST}} -- --exact --show-output --include-ignored

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf target .cache dist builder

  docker:build:
    desc: Build the container image used for the `docker:run` target
    preconditions:
      - sh: which docker
        msg: "Prerequisite utility 'docker' is not installed"
    status:
      - docker images | grep {{.IMAGE_NAME}} | grep {{.IMAGE_TAG}}
    cmds:
      - docker build -t {{.IMAGE_NAME}}:{{.IMAGE_TAG}} .

  docker:run:
    desc: Run tasks inside Docker. E.g. go-task docker:run TARGET=build TARGET_ARCH=x86_64-unknown-linux-gnu
    aliases:
      - in-docker
    deps:
      - docker:build
    preconditions:
      - sh: which docker
        msg: "Prerequisite utility 'docker' is not installed"
    vars:
      UID:
        sh: id -u
      GID:
        sh: id -g
      PWD:
        sh: pwd
      SSH_KEY:
        sh: echo "${SSH_KEY}"
    requires:
      vars:
        - TARGET
    cmds:
      - mkdir -p .cache/home
      - mkdir -p .cache/var/lib/rpm
      # A /etc/passwd entry is required so the correct ~/.ssh path is used
      - echo -e "build:x:{{.UID}}:{{.GID}}::/home/build:/bin/bash" > .cache/passwd
      # Use the SSH key from the host
      - |
        mkdir -p .cache/.ssh
        {{ if ne .SSH_KEY "" }}
          echo "{{.SSH_KEY}}" > .cache/.ssh/id_ed25519
          chmod 600 .cache/.ssh/id_ed25519
        {{ else }}
          cp ~/.ssh/* .cache/.ssh
        {{ end }}
      - |
        docker run --rm \
          -v "{{.PWD}}:{{.PWD}}" \
          -v "{{.PWD}}/.cache/home:/home/build" \
          -v "{{.PWD}}/.cache/var/lib/rpm:/var/lib/rpm" \
          -v "{{.PWD}}/.cache/.ssh:/home/build/.ssh" \
          -v "{{.PWD}}/.cache/passwd:/etc/passwd" \
          --workdir "{{.PWD}}" \
          -e HOME=/home/build \
          -e CARGO_HOME=/home/build/.cargo \
          -e BUILD_TYPE=${BUILD_TYPE} \
          -e PKG_CONFIG_SYSROOT_DIR="/usr/{{.ARCH}}-linux-gnu" \
          -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
          -e GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
          --user {{.UID}}:{{.GID}} \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} \
          task {{.TARGET}} ARCH={{.ARCH}} TARGET_ARCH={{.TARGET_ARCH}}
