name: "🎉 Release"

on:
  workflow_dispatch:
    inputs: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      # This builds the full libcosmic + wgpu + cosmic-files stack twice (once
      # per arch) inside the builder image. A stock runner does not have the disk
      # for that and the linker dies with SIGBUS partway through.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install Task
        uses: go-task/setup-task@v1
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: |
          npm install @semantic-release/exec @semantic-release/git @semantic-release/changelog @semantic-release/github
      - run: |
          task release
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "No release was created - no relevant changes found"
            exit 0
          fi
          # semantic-release has already rewritten Cargo.toml to the new version.
          export VERSION=$(grep '^version' Cargo.toml | head -n 1 | cut -d'"' -f2)
          task repo:update ARCH=x86_64 VERSION=$VERSION
          task repo:update ARCH=aarch64 VERSION=$VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          PACKAGES_UPLOAD_TOKEN: ${{ secrets.PACKAGES_UPLOAD_TOKEN }}
